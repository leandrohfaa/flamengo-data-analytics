# Sem segredos aqui: credenciais vêm do AWS CLI (~/.aws) e buckets de variáveis de ambiente.
flamengo:
  target: dev
  outputs:
    dev:
      type: athena
      region_name: us-east-1
      database: awsdatacatalog
      schema: flamengo
      work_group: flamengo-data-analytics
      s3_staging_dir: "s3://{{ env_var('ATHENA_RESULTS_BUCKET') }}/dbt/"
      s3_data_dir: "s3://{{ env_var('DATA_LAKE_BUCKET') }}/"
      s3_data_naming: schema_table   # dados em s3://<bucket>/flamengo_silver/<tabela>/
      threads: 4
